<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adhy & Destin - Disposable Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a;
    --panel: #161412;
    --border: #292420;
    --ink: #f4ecdf;
    --muted: #8c8275;
    --accent: #ff6b35;
    --accent-glow: rgba(255, 107, 53, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Mono', monospace; overflow-x: hidden; }
  .app { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; }
  .brand h2 { font-family: 'Fraunces', serif; font-style: italic; font-size: 20px; color: var(--ink); cursor: pointer; user-select: none; }
  .brand p { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin-top: 1px; }
  .date-badge { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  
  .camera-box { background: var(--panel); border-radius: 28px; padding: 12px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px; }
  .viewfinder { position: relative; aspect-ratio: 3/4; border-radius: 20px; overflow: hidden; background: #000; border: 2px solid var(--border); }
  video, #preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  #preview { position: absolute; inset: 0; display: none; z-index: 2; }
  
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.22; mix-blend-mode: overlay; z-index: 3; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.7'/></svg>"); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 4; }
  .flash.on { opacity: 1; transition: none; }
  
  .lens-switcher { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(12, 11, 10, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); padding: 4px 8px; border-radius: 99px; gap: 6px; z-index: 5; }
  .lens-btn { background: transparent; border: none; color: var(--muted); font: inherit; font-size: 11px; padding: 5px 12px; border-radius: 99px; cursor: pointer; transition: all 0.2s; }
  .lens-btn.active { background: var(--ink); color: #0c0b0a; font-weight: 700; }
  
  .control-panel { background: #11100e; border-radius: 20px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
  .btn-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: transform 0.1s, background 0.2s; }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon.active-flash { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
  
  .counter-badge { width: 54px; height: 54px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: default; }
  .counter-num { font-size: 16px; font-weight: 700; color: var(--accent); line-height: 1; }
  .counter-lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  
  .shutter-main { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #2e2621; background: radial-gradient(circle at 35% 30%, #ff8a55, var(--accent) 60%, #b84102); box-shadow: 0 5px 0 #6e2501, 0 8px 20px var(--accent-glow); cursor: pointer; transition: transform 0.1s; }
  .shutter-main:active { transform: translateY(3px); box-shadow: 0 2px 0 #6e2501; }
  .shutter-main:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .actions { display: none; gap: 10px; }
  .actions button { flex: 1; padding: 14px; border-radius: 14px; border: none; font: inherit; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: transform 0.1s; }
  .actions button:active { transform: scale(0.98); }
  .retake { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .save { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
  
  .status { text-align: center; font-size: 11px; color: var(--muted); min-height: 18px; }

  .modal { position: fixed; inset: 0; background: rgba(12,11,10,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .card { background: var(--panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
  .card h2 { font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; margin-bottom: 6px; }
  .card p { font-size: 11px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .card input, .card select { width: 100%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: #0c0b0a; color: var(--ink); font: inherit; outline: none; }
  .card button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); }
  .card .btn-secondary { background: var(--border); color: var(--ink); margin-top: 8px; box-shadow: none; }
</style>
</head>
